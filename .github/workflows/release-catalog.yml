name: Release catalog

on:
  workflow_dispatch:
    inputs:
      version:
        description: Dataset version (for example 2026.08.1)
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run python -m unittest discover -v

      - name: Validate catalog
        run: uv run main.py --validate

      - name: Create release artifacts
        env:
          VERSION: ${{ inputs.version }}
        run: >-
          uv run main.py
          --release-version "$VERSION"
          --source-commit "$GITHUB_SHA"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if gh release view "catalog-$VERSION" >/dev/null 2>&1; then
            gh release upload "catalog-$VERSION" \
              dist/catalog.sqlite3 \
              dist/catalog.sqlite3.sha256 \
              dist/catalog-manifest.json \
              --clobber
          else
            gh release create "catalog-$VERSION" \
              dist/catalog.sqlite3 \
              dist/catalog.sqlite3.sha256 \
              dist/catalog-manifest.json \
              --title "Catalog $VERSION" \
              --generate-notes
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy catalog to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
