name: Generate exam data

on:
  workflow_dispatch:
    inputs:
      commit_message:
        description: Commit message for generated data
        required: true
        default: "data: generate exam catalog"
        type: string
      regenerate_all:
        description: Regenerate every exam data.json with Gemini
        required: true
        default: false
        type: boolean

concurrency:
  group: generate-data-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run python -m unittest discover -v

      - name: Generate exam data and catalog
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REGENERATE_ALL: ${{ inputs.regenerate_all }}
        run: |
          if [ "$REGENERATE_ALL" = "true" ]; then
            uv run main.py --regenerate-all
          else
            uv run main.py
          fi

      - name: Commit generated files
        env:
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git commit -m "$COMMIT_MESSAGE"
          git push origin "HEAD:${GITHUB_REF_NAME}"
